<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Yani Coach · Wireframes</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; font-family: "Kalam", "Caveat", cursive; }
  #root { width: 100%; height: 100%; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="variants.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
  // Each artboard renders one wireframe variant. ~1280x820 desktop frame.
  function App() {
    const V = window.YaniWireframes;
    return (
      <DesignCanvas
        title="Yani Coach · Dashboard wireframes"
        subtitle="4 enfoques low-fi del Resumen. Click la flecha para abrir en pantalla completa. Andá elegiendo qué te gusta de cada uno."
      >
        <DCSection
          id="layouts"
          title="Layouts del Resumen"
          subtitle="Cada artboard varía: forma del embudo · estilo de KPI · color de acento"
        >
          <DCArtboard id="va" label="A · Clásico (dorado · glass · embudo vertical)" width={1280} height={820}>
            <V.VariantA />
          </DCArtboard>
          <DCArtboard id="vb" label="B · Funnel Hero (cobre · sólidas · embudo horizontal)" width={1280} height={820}>
            <V.VariantB />
          </DCArtboard>
          <DCArtboard id="vc" label="C · Story Feed (esmeralda · sparkline · silueta)" width={1280} height={820}>
            <V.VariantC />
          </DCArtboard>
          <DCArtboard id="vd" label="D · Split Studio (esmeralda · glass+spark · barras drop-off)" width={1280} height={820}>
            <V.VariantD />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
