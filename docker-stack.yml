# Stack del Dashboard Yani Coach para Portainer (Docker Swarm).
# Servicios: web (estático + auth) y sync (espejo NocoDB->Supabase, timer 1h).
#
# Deploy EN EL VPS:
#   1. docker build -f Dockerfile.web --build-arg VITE_SUPABASE_URL=... \
#        --build-arg VITE_SUPABASE_ANON_KEY=... --build-arg VITE_SUPABASE_TENANT_ID=... \
#        -t yani-dashboard-web:local .
#   2. docker build -f scripts/sync/Dockerfile -t yani-dashboard-sync:local .
#   3. Portainer -> Stacks -> Add stack -> pegar este YAML -> setear env -> Deploy
#
# ⚠ Confirmá los nombres reales de entrypoint y certresolver de Traefik contra un
#   servicio ya enrutado (ver Task 9, Step 1). Acá usamos los convencionales
#   `websecure` y `letsencrypt`; ajustá si tu Traefik usa otros.

services:
  yani_dashboard_web:
    image: yani-dashboard-web:local
    environment:
      NODE_ENV: "production"
      PORT: "8080"
      AUTH_PASSWORD: "${AUTH_PASSWORD:?set AUTH_PASSWORD}"
      AUTH_SECRET: "${AUTH_SECRET:?set AUTH_SECRET}"
      # Cambio de postura de seguridad (Task 3, plan cierre-espejo-anon): el web
      # antes NO tenía service_role — solo la anon key horneada en el bundle.
      # Ahora sí, para poder servir filas de personas desde /api/metrics/*, pero
      # SIEMPRE detrás del guard requireSession (cookie yd_auth válida). Nunca
      # llega al navegador: vive solo en este proceso server-side. Mismo patrón
      # de var requerida que ya usa yani_dashboard_sync más abajo.
      SUPABASE_URL: "${SUPABASE_URL:?set SUPABASE_URL}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:?set SUPABASE_SERVICE_ROLE_KEY}"
      SUPABASE_TENANT_ID: "${SUPABASE_TENANT_ID:-7558d73a-e97b-4422-ab5c-db87f6626592}"
    networks:
      - yanicoach
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=Yanicoach"
        - "traefik.http.routers.yanidash.rule=Host(`${DASHBOARD_DOMAIN:?set DASHBOARD_DOMAIN}`)"
        - "traefik.http.routers.yanidash.entrypoints=websecure"
        - "traefik.http.routers.yanidash.tls=true"
        - "traefik.http.routers.yanidash.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.yanidash.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', r => r.statusCode===200?process.exit(0):process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  yani_dashboard_sync:
    image: yani-dashboard-sync:local
    environment:
      VITE_NOCODB_URL: "${VITE_NOCODB_URL:-https://app.nocodb.com}"
      VITE_NOCODB_TOKEN: "${VITE_NOCODB_TOKEN:?set VITE_NOCODB_TOKEN}"
      VITE_TABLE_SELLERS: "${VITE_TABLE_SELLERS:-me6kwgo0qvg0aug}"
      VITE_TABLE_CONTACTS: "${VITE_TABLE_CONTACTS:-mrwhtwissgz1xzr}"
      VITE_TABLE_INTERACTIONS: "${VITE_TABLE_INTERACTIONS:-m6gx25reozjbbt3}"
      VITE_TABLE_SALES: "${VITE_TABLE_SALES:-mm9p02mlk0i5ysy}"
      VITE_TABLE_ATTEMPTS: "${VITE_TABLE_ATTEMPTS:-mqdlglkwjvvtplc}"
      SUPABASE_URL: "${SUPABASE_URL:?set SUPABASE_URL}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:?set SUPABASE_SERVICE_ROLE_KEY}"
      SUPABASE_TENANT_SLUG: "${SUPABASE_TENANT_SLUG:-yani-coach}"
      CHATWOOT_URL: "${CHATWOOT_URL:-https://chatwoot.yanicoach.com}"
      CHATWOOT_TOKEN: "${CHATWOOT_TOKEN:?set CHATWOOT_TOKEN}"
      CHATWOOT_ACCOUNT_ID: "${CHATWOOT_ACCOUNT_ID:-1}"
      PORT: "3000"
      NODE_ENV: "production"
    networks:
      - yanicoach
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => r.statusCode===200?process.exit(0):process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Proxy de ritmo delante de NocoDB Cloud — cura del 429 (pacing global <5/s + backoff 429).
  # Build: docker build -f scripts/nocodb-proxy/Dockerfile -t yani-nocodb-proxy:local .
  # n8n le pega por DNS interno de la red Yanicoach: http://yani_nocodb_proxy:8090
  # (requiere que el contenedor n8n esté unido a la red `Yanicoach`; si no, ver nota en el runbook).
  yani_nocodb_proxy:
    image: yani-nocodb-proxy:local
    environment:
      PORT: "8090"
      NOCODB_UPSTREAM: "${NOCODB_UPSTREAM:-https://app.nocodb.com}"
      RATE_PER_SEC: "${PROXY_RATE_PER_SEC:-4}"
      BUCKET_CAPACITY: "${PROXY_BUCKET_CAPACITY:-4}"
      MAX_ATTEMPTS: "8"
      MAX_BACKOFF_MS: "30000"
      NODE_ENV: "production"
      # NOCODB_INJECT_TOKEN: queda VACÍO = passthrough (cada workflow manda su propio xc-token).
      # Solo setear en la fase de hardening si se decide centralizar el token.
    networks:
      - yanicoach
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8090/health', r => r.statusCode===200?process.exit(0):process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  yanicoach:
    external: true
    name: Yanicoach
